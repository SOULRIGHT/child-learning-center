{% extends "base.html" %}

{% block title %}리포트 열람 안내{% endblock %}
{% block page_title %}리포트 열람 안내{% endblock %}

{% block content %}
<div class="container-fluid">
    <div class="card">
        <div class="card-body py-5 text-center">
            <i class="bi bi-qr-code-scan text-primary" style="font-size: 3rem;"></i>
            <h4 class="mt-3 fw-bold">QR 코드를 스캔해 리포트를 열어주세요</h4>
            <p class="text-muted mb-4">
                학생열람 계정은 개별 리포트 링크로만 접근할 수 있습니다.
            </p>
            <div class="small text-muted">
                인쇄물의 QR을 스캔하면 해당 학생의 리포트 페이지로 이동합니다.
            </div>
        </div>
    </div>
</div>
{% endblock %}
