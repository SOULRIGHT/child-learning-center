{% for value, label in weekday_choices %}
<div class="form-check form-check-inline">
    <input class="form-check-input" type="checkbox"
           name="{{ field_name }}" id="{{ id_prefix }}-{{ value }}" value="{{ value }}"
           {% if value in selected_weekdays %}checked{% endif %}>
    <label class="form-check-label" for="{{ id_prefix }}-{{ value }}">{{ label }}</label>
</div>
{% endfor %}
