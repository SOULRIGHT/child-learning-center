{% extends "base.html" %}

{% block title %}교재 계획 수정{% endblock %}
{% block page_title %}교재 계획 수정{% endblock %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3 flex-wrap gap-2">
    <div>
        <h4 class="mb-1">교재 계획 수정</h4>
        <p class="text-muted mb-0">목표 완료일, 페이지 범위, 제외 페이지를 고칠 수 있습니다.</p>
    </div>
    <a href="{{ url_for('planning.manage_workbook_plans') }}" class="btn btn-outline-secondary">목록으로</a>
</div>

<div class="card">
    <div class="card-body">
        <form method="post" action="{{ url_for('planning.edit_workbook_plan', plan_id=plan.id) }}">
            {% set form_id = 'edit-plan' %}
            {% include 'settings/_workbook_plan_form.html' %}
            <div class="mt-3">
                <button class="btn btn-primary" type="submit">저장</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
