<form method="post" action="{{ url_for('progress.save_progress', child_id=child.id) }}" class="row g-2 align-items-end">
    <input type="hidden" name="return_to" value="{{ return_to }}">
    <div class="col-md-3">
        <label class="form-label" for="learning_subject_id_{{ return_to }}">과목</label>
        <select class="form-select" id="learning_subject_id_{{ return_to }}" name="learning_subject_id" required>
            {% for subject in active_subjects %}
            <option value="{{ subject.id }}">{{ subject.name }}</option>
            {% endfor %}
        </select>
    </div>
    <div class="col-md-4">
        <label class="form-label" for="textbook_title_{{ return_to }}">교재명</label>
        <input class="form-control" id="textbook_title_{{ return_to }}" name="textbook_title" required maxlength="120" placeholder="예: 쎈 수학 5-2">
    </div>
    <div class="col-md-2">
        <label class="form-label" for="page_{{ return_to }}">현재 페이지</label>
        <input class="form-control" id="page_{{ return_to }}" name="page" type="number" min="1" max="2000" required>
    </div>
    <div class="col-md-2">
        <label class="form-label" for="recorded_on_{{ return_to }}">기록 날짜</label>
        <input class="form-control" id="recorded_on_{{ return_to }}" name="recorded_on" type="date" value="{{ kst_today.isoformat() }}" max="{{ kst_today.isoformat() }}" required>
    </div>
    <div class="col-md-1">
        <button class="btn btn-primary w-100" type="submit" {% if not active_subjects %}disabled{% endif %}>저장</button>
    </div>
</form>
{% if not active_subjects %}
<p class="small text-muted mt-2 mb-0">활성 학습 과목이 없습니다.</p>
{% endif %}
